name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRD §23 — a passing CI run is required to merge. Configure branch protection
# to require these jobs; the workflow alone does not enforce it.

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wpx
          POSTGRES_PASSWORD: wpx
          POSTGRES_DB: wpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wpx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://wpx:wpx@localhost:5432/wpx_test
      JWT_SECRET: ci-jwt-secret-value-at-least-32-characters-long
      PROFILE_ENCRYPTION_KEY: ci-profile-encryption-key-at-least-32-chars

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend — types and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Type check
        run: npx tsc -b

      - name: Tests
        run: npm test

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build ./backend
      - name: Build web image
        run: docker build ./frontend

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # §16.2 requires dependency scanning. Reporting only to begin with — a
    # transitive advisory should not block an unrelated PR on day one.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python advisories
        run: |
          pip install pip-audit
          pip-audit --desc -r <(pip install -q -e ./backend --dry-run --report - 2>/dev/null || echo "") || \
            (cd backend && pip install -e . -q && pip-audit --desc)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm advisories
        run: cd frontend && npm install --package-lock-only && npm audit --audit-level=high
