name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRD §23 — a passing CI run is required to merge. Configure branch protection
# to require these jobs; the workflow alone does not enforce it.

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wpx
          POSTGRES_PASSWORD: wpx
          POSTGRES_DB: wpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wpx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://wpx:wpx@localhost:5432/wpx_test
      JWT_SECRET: ci-jwt-secret-value-at-least-32-characters-long
      PROFILE_ENCRYPTION_KEY: ci-profile-encryption-key-at-least-32-chars
      # §7.3 — CI never calls a third-party API. A red build caused by Yahoo having
      # a bad afternoon tells us nothing about the change under review.
      MARKET_DATA_PROVIDER: synthetic
      ECONOMIC_DATA_PROVIDER: synthetic
      MODEL_ARTIFACT_DIR: /tmp/wpx-artifacts
      # 20k profiles is the production default; 2k reproduces the same behaviour
      # and keeps the pipeline honest about its own runtime.
      RISK_TRAINING_POPULATION: "2000"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Migrations round-trip
        # Down-then-up, not just up: the M1 revision's downgrade left its enum types
        # behind, and an upgrade-only check passes straight over that.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Schema matches the models
        # An autogenerate diff that is not empty means the migrations and the models
        # have drifted, which makes every future diff untrustworthy.
        run: |
          alembic revision --autogenerate -m drift-check --rev-id ci_drift_check
          if grep -qE '^\s+op\.' alembic/versions/ci_drift_check_*.py; then
            echo "::error::Models and migrations have drifted:"
            cat alembic/versions/ci_drift_check_*.py
            exit 1
          fi
          rm alembic/versions/ci_drift_check_*.py

      - name: Ingestion jobs run end to end
        # FR-04/FR-05 exercised as an operator runs them, against the synthetic
        # providers. Catches wiring the unit tests cannot: CLI arguments, settings
        # loading, and the exit codes the scheduler reads.
        run: |
          python -m app.jobs seed-assets
          # Enough history for the 60-day indicators plus a usable train/test split.
          python -m app.jobs ingest-market --backfill-days 1100
          python -m app.jobs ingest-economic

      - name: ML pipeline trains, gates and serves
        # §10.5 exercised as an operator runs it. The promotion gate in particular:
        # a registry that promotes whatever it is handed is governance theatre, and
        # only an end-to-end run catches a gate wired up wrong.
        run: |
          python -m app.jobs train-risk
          python -m app.jobs promote risk_classifier v1
          python -m app.jobs train-prediction
          python -m app.jobs promote market_predictor v1 || \
            echo "market_predictor did not beat the baseline — expected on synthetic data"
          python -m app.jobs models

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend — types and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Type check
        run: npx tsc -b

      - name: Tests
        run: npm test

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build ./backend
      - name: Build web image
        run: docker build ./frontend

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # §16.2 requires dependency scanning. Reporting only to begin with — a
    # transitive advisory should not block an unrelated PR on day one.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python advisories
        run: |
          pip install pip-audit
          pip install -e ./backend
          pip-audit --desc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm advisories
        run: |
          cd frontend
          npm install --package-lock-only
          npm audit --audit-level=high
