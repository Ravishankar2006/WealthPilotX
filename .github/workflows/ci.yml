name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRD §23 — a passing CI run is required to merge. Configure branch protection
# to require these jobs; the workflow alone does not enforce it.

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wpx
          POSTGRES_PASSWORD: wpx
          POSTGRES_DB: wpx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wpx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://wpx:wpx@localhost:5432/wpx_test
      JWT_SECRET: ci-jwt-secret-value-at-least-32-characters-long
      PROFILE_ENCRYPTION_KEY: ci-profile-encryption-key-at-least-32-chars
      # §7.3 — CI never calls a third-party API. A red build caused by Yahoo having
      # a bad afternoon tells us nothing about the change under review.
      MARKET_DATA_PROVIDER: synthetic
      ECONOMIC_DATA_PROVIDER: synthetic
      MODEL_ARTIFACT_DIR: /tmp/wpx-artifacts
      # 20k profiles is the production default; 2k reproduces the same behaviour
      # and keeps the pipeline honest about its own runtime.
      RISK_TRAINING_POPULATION: "2000"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Migrations round-trip
        # Down-then-up, not just up: the M1 revision's downgrade left its enum types
        # behind, and an upgrade-only check passes straight over that.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Schema matches the models
        # An autogenerate diff that is not empty means the migrations and the models
        # have drifted, which makes every future diff untrustworthy.
        run: |
          alembic revision --autogenerate -m drift-check --rev-id ci_drift_check
          if grep -qE '^\s+op\.' alembic/versions/ci_drift_check_*.py; then
            echo "::error::Models and migrations have drifted:"
            cat alembic/versions/ci_drift_check_*.py
            exit 1
          fi
          rm alembic/versions/ci_drift_check_*.py

      - name: Ingestion jobs run end to end
        # FR-04/FR-05 exercised as an operator runs them, against the synthetic
        # providers. Catches wiring the unit tests cannot: CLI arguments, settings
        # loading, and the exit codes the scheduler reads.
        run: |
          python -m app.jobs seed-assets
          # Enough history for the 60-day indicators plus a usable train/test split.
          python -m app.jobs ingest-market --backfill-days 1100
          python -m app.jobs ingest-economic

      - name: ML pipeline trains, gates and serves
        # §10.5 exercised as an operator runs it. The promotion gate in particular:
        # a registry that promotes whatever it is handed is governance theatre, and
        # only an end-to-end run catches a gate wired up wrong.
        run: |
          python -m app.jobs train-risk
          python -m app.jobs promote risk_classifier v1
          # A reserved period, so §19's backtest has genuinely out-of-sample data.
          python -m app.jobs train-prediction --holdout-days 200
          python -m app.jobs promote market_predictor v1 || \
            echo "market_predictor did not beat the baseline — expected on synthetic data"
          python -m app.jobs models

      - name: Predictions generate for the whole universe
        # The CLI half of FR-08. Portfolio generation needs a registered user with a
        # profile and a risk assessment, which no CLI command can create — that path
        # is covered end to end by tests/test_portfolio_api.py in the step below,
        # and §19's backtest needs a stored portfolio, so neither is scripted here.
        run: |
          python -m app.jobs promote market_predictor v1 --force
          python -m app.jobs predict

      - name: Tests
        # §20's coverage pass. The floor is the measured value rounded down, and it
        # is there to stop coverage falling — not to be chased upward. Tests written
        # to cover a line rather than a behaviour make the suite slower and the
        # number prettier.
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=89

  frontend:
    name: Frontend — types and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Tests
        # §20's coverage pass, frontend half. Thresholds live in vite.config.ts.
        run: npm run test:coverage

  e2e:
    name: End-to-end — the full journey
    runs-on: ubuntu-latest
    # §20's end-to-end layer. The PRD says "against a staging environment"; there is
    # none (§17.2 keeps this project unlaunched), so it runs against the Compose
    # stack — the same images this workflow builds. Stated rather than implied.
    #
    # Nothing is stubbed. Every other suite tests one side of a boundary against a
    # mock of the other, which is what let the M6 /fairness/report 500 through three
    # green test layers.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Both installs run before the stack starts, and the order is load-bearing.
      # The web service bind-mounts ./frontend and layers an anonymous volume on
      # /srv/node_modules; Docker creates that mount point inside the bind mount,
      # so an absent frontend/node_modules comes back root-owned on the host and
      # every later npm command dies with EACCES.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Write the environment the stack needs
        run: |
          cat > .env <<'ENVFILE'
          ENVIRONMENT=local
          POSTGRES_USER=wpx
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=wealthpilotx
          POSTGRES_PORT=5432
          API_PORT=8000
          WEB_PORT=5173
          JWT_SECRET=ci-jwt-secret-value-at-least-32-characters-long
          PROFILE_ENCRYPTION_KEY=ci-profile-encryption-key-at-least-32-chars
          MARKET_DATA_PROVIDER=synthetic
          ECONOMIC_DATA_PROVIDER=synthetic
          VITE_API_BASE_URL=http://localhost:8000/api/v1
          CORS_ORIGINS=http://localhost:5173
          RISK_TRAINING_POPULATION=2000
          ENVFILE

      - name: Start the stack
        run: docker compose up -d --build db api web

      - name: Wait for the API to be ready
        # Polling /health rather than sleeping: migrations run on start, and a fixed
        # sleep is either too short on a cold runner or wasted on a warm one.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null; then
              echo "api ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::API never became ready"; docker compose logs api; exit 1

      - name: Seed data and promote models
        # The journey needs a risk model to classify with and prices to optimise
        # over. Without this the run would fail on a 503 that says nothing about the
        # change under review.
        run: |
          docker compose exec -T api python -m app.jobs seed-assets
          docker compose exec -T api python -m app.jobs ingest-market --backfill-days 1100
          docker compose exec -T api python -m app.jobs ingest-economic
          docker compose exec -T api python -m app.jobs train-risk
          docker compose exec -T api python -m app.jobs promote risk_classifier v1
          docker compose exec -T api python -m app.jobs train-prediction --holdout-days 200
          docker compose exec -T api python -m app.jobs promote market_predictor v1 --force
          docker compose exec -T api python -m app.jobs predict

      - name: Run the journey
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build ./backend
      - name: Build web image
        run: docker build ./frontend

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # §16.2 requires dependency scanning. Non-blocking from M2 so a transitive
    # advisory could not fail an unrelated change on day one; blocking from M6, now
    # that there is a triage process behind it. The threshold is high-and-above:
    # anything serious fails the build, while moderate findings stay visible and are
    # assessed by hand in Docs/SECURITY-REVIEW.md rather than silenced by a number.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python advisories
        run: |
          pip install pip-audit
          pip install -e ./backend
          pip-audit --desc

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm advisories
        run: |
          cd frontend
          npm install --package-lock-only
          npm audit --audit-level=high
