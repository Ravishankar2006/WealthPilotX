name: wealthpilotx

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wpx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wealthpilotx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpx} -d ${POSTGRES_DB:-wealthpilotx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wpx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wealthpilotx}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:?PROFILE_ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The suite truncates tables, so it must never point at the app database.
      # conftest.py refuses any database whose name lacks "test", and creates
      # this one if it does not exist yet.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wpx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wealthpilotx}_test
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # :z relabels for SELinux (Fedora, RHEL). A no-op elsewhere.
      - ./backend:/srv:z
    depends_on:
      db:
        condition: service_healthy
    # Migrations run on start so a fresh clone needs exactly one command.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/srv:z
      - /srv/node_modules
    depends_on:
      - api

volumes:
  pgdata:
