name: wealthpilotx

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wpx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wealthpilotx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wpx} -d ${POSTGRES_DB:-wealthpilotx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wpx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wealthpilotx}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:?PROFILE_ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-synthetic}
      ECONOMIC_DATA_PROVIDER: ${ECONOMIC_DATA_PROVIDER:-synthetic}
      FRED_API_KEY: ${FRED_API_KEY:-}
      MODEL_ARTIFACT_DIR: /srv/artifacts
      # The suite truncates tables, so it must never point at the app database.
      # conftest.py refuses any database whose name lacks "test", and creates
      # this one if it does not exist yet.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wpx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wealthpilotx}_test
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # :z relabels for SELinux (Fedora, RHEL). A no-op elsewhere.
      - ./backend:/srv:z
      # Shared with the scheduler, which trains; a named volume rather than a bind
      # mount so artifacts survive a rebuild without landing in the repo.
      - artifacts:/srv/artifacts
    depends_on:
      db:
        condition: service_healthy
    # Migrations run on start so a fresh clone needs exactly one command.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Ingestion runs in its own container, not inside the API (Phase 2 plan,
  # decision 2): an in-process scheduler would fire once per API replica the moment
  # the API scales (§16.4), and would compete with request handling.
  scheduler:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wpx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wealthpilotx}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:?PROFILE_ENCRYPTION_KEY is required}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-synthetic}
      ECONOMIC_DATA_PROVIDER: ${ECONOMIC_DATA_PROVIDER:-synthetic}
      FRED_API_KEY: ${FRED_API_KEY:-}
      MODEL_ARTIFACT_DIR: /srv/artifacts
    volumes:
      - ./backend:/srv:z
      - artifacts:/srv/artifacts
    depends_on:
      # Waits for the API because the API applies the migrations; starting against
      # a schema that does not exist yet would just crash-loop until it did.
      api:
        condition: service_healthy
    # Seed the universe and, on a genuinely empty database, backfill history — so a
    # fresh stack has data immediately instead of waiting for the first cron window.
    # `bootstrap` skips the backfill when market data already exists, so a container
    # restart does not re-hammer the provider.
    command: >
      sh -c "python -m app.jobs bootstrap &&
             python -m app.jobs.scheduler"
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/srv:z
      - /srv/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
