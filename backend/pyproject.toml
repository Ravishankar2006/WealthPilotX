[project]
name = "wealthpilotx-backend"
version = "0.1.0"
description = "WealthPilotX API — AI-driven financial decision-support platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "email-validator>=2.2",
    # --- Data platform (M2) ---
    "httpx>=0.28",          # FRED client
    "yfinance>=0.2.50",     # imported only by app/providers/yahoo.py (§7.3)
    "apscheduler>=3.11",    # the scheduler container's cron
    # --- ML (M3) ---
    # Python is pinned to 3.12 in the Dockerfile precisely so these have wheels.
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    # xgboost-cpu, not xgboost: the default wheel pulls nvidia-nccl for multi-GPU
    # training — a 252 MB download this project will never use, since PRD §7.2
    # scopes training to a single modest workstation. The CPU wheel is published
    # for linux/x86_64 and Windows only, so other platforms fall back to the
    # standard package.
    "xgboost-cpu>=2.1; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "xgboost>=2.1; platform_machine != 'x86_64' or sys_platform != 'linux'",
    "joblib>=1.4",
    # --- Recommendation (M4) ---
    # Arrives transitively with scikit-learn, but the optimizer imports it
    # directly, so it is declared rather than relied on as a side effect.
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = "^(alembic|tests)/"

# Neither package ships type information. Confined to the two modules that import
# them (§7.3 keeps the vendor surface small), so this silences the stub warning
# without weakening checking anywhere else.
[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "apscheduler.*",
    # The ML stack ships no py.typed marker. pandas-stubs exists but is strict
    # enough to generate substantial churn on legitimate DataFrame code; the
    # ignore is confined to these imports rather than weakening checking anywhere.
    "pandas.*",
    "sklearn.*",
    "xgboost.*",
    "joblib.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # joblib's array reconstruction assigns to `array.shape`, which NumPy 2.5
    # deprecated. It fires on every model artifact load, so escalating it would make
    # the ML suite unrunnable over a third-party incompatibility we cannot fix here.
    # Scoped to that one message in that one module, so the project-wide
    # error-on-deprecation policy is untouched everywhere else.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]
