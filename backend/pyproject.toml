[project]
name = "wealthpilotx-backend"
version = "0.1.0"
description = "WealthPilotX API — AI-driven financial decision-support platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "email-validator>=2.2",
    # --- Data platform (M2) ---
    "httpx>=0.28",          # FRED client
    "yfinance>=0.2.50",     # imported only by app/providers/yahoo.py (§7.3)
    "apscheduler>=3.11",    # the scheduler container's cron
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = "^(alembic|tests)/"

# Neither package ships type information. Confined to the two modules that import
# them (§7.3 keeps the vendor surface small), so this silences the stub warning
# without weakening checking anywhere else.
[[tool.mypy.overrides]]
module = ["yfinance.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
